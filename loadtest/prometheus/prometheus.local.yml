# Local rehearsal (loadtest/local/compose.yml). k6 pushes its samples here by remote write
# (Prometheus runs with --web.enable-remote-write-receiver).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: engine
    static_configs:
      - targets: [w1:7070, w2:7070, w3:7070, w4:7070]
  - job_name: api
    static_configs:
      - targets: [api:9464]
  - job_name: nginx
    static_configs:
      - targets: [nginx-exporter:9113]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
